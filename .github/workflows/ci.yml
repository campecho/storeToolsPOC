# CI for the Store Tools POC (docs/LAYOUT_EDITOR_PLAN.md).
#
# Four independent lanes, run in parallel:
#   checks      — fixture lane (plan §10.1): lint + typecheck + unit/fidelity
#                 tests from checked-in fixtures; zero native dependencies.
#   e2e         — Playwright against `next dev`; the webServer config forces
#                 STP_IMPORT_FIXTURE=1 itself, so this lane is also binary-free.
#   live-import — plan §10.6 harness lane: installs libmspub-tools, regenerates
#                 the corpus from the live binaries, gates on fixture drift,
#                 then runs the full suite with the live-gated adversarial
#                 tests enabled (STP_LIVE_IMPORT=1).
#   docker      — deploy-image smoke (photo plan §4 PE10a): builds the Dockerfile,
#                 boots the standalone runner, and round-trips the photo pipeline
#                 (GET diagnostics → intake → render) — the proof that the traced
#                 worker + sharp actually resolve inside the image, which no
#                 repo-root lane can give.

name: CI

on:
  push:
    # publisher-prototype/ is a self-contained app with its own CI shim
    # (publisher-prototype-ci.yml); prototype-only pushes skip all four POC
    # lanes. The docker lane stays intact — it is the smoke proof for the
    # jailed render service the prototype's plan cites as the dev team's
    # working reference.
    paths-ignore:
      - "publisher-prototype/**"
      - "CLAUDE.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # libheif-examples: heif-convert for the PE7 HEIC-open e2e — the dev server
      # this lane spawns must decode HEIC for that test to be a real proof.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-examples
      # playwright.config.ts starts `npm run dev` as its webServer (no build
      # step needed) and sets STP_IMPORT_FIXTURE=1 for it — don't duplicate.
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  live-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Ubuntu ships pub2raw + pub2xhtml in libmspub-tools (0.1.4); liblcms2-utils
      # provides `tificc` (the CMYK-preserving path, PE5); libheif-examples provides
      # `heif-convert` (the HEIC ingest path, PE7); poppler-utils powers pdf-wrap's
      # skip-if-absent external-viewer preflight (pdfinfo/pdftoppm).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmspub-tools liblcms2-utils libheif-examples poppler-utils
      - run: npm ci
      - run: npm run refresh:corpus
      # Drift gate: the checked-in corpus artifacts must match what today's
      # binaries produce from fixtures/pub-corpus.
      - name: Check corpus fixtures for drift
        run: |
          # `git status --porcelain` (not plain `git diff`) so brand-new
          # untracked outputs from refresh:corpus count as drift too.
          drift="$(git status --porcelain -- fixtures/pub-traces fixtures/pub-refs)"
          if [ -n "$drift" ]; then
            git status -- fixtures/pub-traces fixtures/pub-refs
            git diff -- fixtures/pub-traces fixtures/pub-refs | head -100
            echo "::error::Corpus fixture drift: the checked-in artifacts under fixtures/pub-traces and fixtures/pub-refs no longer match what refresh:corpus produces from today's binaries."
            echo "Either a fixture was edited by hand, or the libmspub toolchain moved."
            echo "If the new output is correct, run 'npm run refresh:corpus' locally and commit the result; otherwise fix the fixture edit."
            exit 1
          fi
      # Photo goldens (plan §4 PE3): replay the committed recipes through the same
      # sharp/photo-worker path the render host drives, then drift-gate the bytes.
      # `sharp` ships with `npm ci`, so no extra toolchain — this rides the
      # live-import lane only to keep every fixture drift gate in one place.
      - run: npm run refresh:photo-goldens
      - name: Check photo goldens for drift
        run: |
          # Same porcelain-over-diff rule as the corpus gate: a fresh golden the
          # refresh script wrote (untracked) is drift too, not just a byte change
          # to a tracked one. Covers recipes + generated goldens under one root.
          drift="$(git status --porcelain -- fixtures/photo-corpus)"
          if [ -n "$drift" ]; then
            git status -- fixtures/photo-corpus
            git diff -- fixtures/photo-corpus | head -100
            echo "::error::Photo golden drift: the checked-in bytes under fixtures/photo-corpus no longer match what refresh:photo-goldens produces from today's render path."
            echo "Either a golden/recipe was edited by hand, or the render/encoder path moved."
            echo "If the new output is correct, run 'npm run refresh:photo-goldens' locally and commit the result; otherwise fix the edit."
            exit 1
          fi
      - run: STP_LIVE_IMPORT=1 npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stp-poc .
      - name: Boot the runner and wait for ready
        run: |
          docker run -d --name stp -p 8080:8080 stp-poc
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/photo >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::Runner never became ready on :8080"
          docker logs stp
          exit 1
      - name: Photo pipeline smoke — diagnostics, intake, render
        run: |
          set -euo pipefail
          # 1. Diagnostics: engine live, worker file resolved inside the image.
          diag="$(curl -fsS http://localhost:8080/api/photo)"
          echo "$diag" | head -c 400; echo
          test "$(echo "$diag" | jq -r .engine.name)" = "sharp"
          test "$(echo "$diag" | jq -r .jailed.worker)" = "true"
          test "$(echo "$diag" | jq -r .formats.heic)" = "true"
          # 2. Intake: the demo photo opens through the jailed decode.
          intake="$(curl -fsS -F "file=@public/photo-demo.jpg;type=image/jpeg" \
            http://localhost:8080/api/photo/intake)"
          test "$(echo "$intake" | jq -r .ok)" = "true"
          # 3. Render: replay an empty recipe at full resolution — the master
          #    round-trips the worker's sharp decode+encode inside the jail.
          echo "$intake" | jq -r .master.b64 | base64 -d > /tmp/master.jpg
          curl -fsS -o /tmp/render.jpg \
            -F "file=@/tmp/master.jpg;type=image/jpeg" \
            -F 'payload={"recipe":[],"format":"jpeg"}' \
            http://localhost:8080/api/photo/render
          # A JPEG comes back (SOI marker) and is non-trivial.
          head -c 2 /tmp/render.jpg | od -An -tx1 | grep -q "ff d8"
          test "$(stat -c%s /tmp/render.jpg)" -gt 10000
      - name: Runner logs on failure
        if: failure()
        run: docker logs stp || true
      - name: Stop the runner
        if: always()
        run: docker rm -f stp || true
