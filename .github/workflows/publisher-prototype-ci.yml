# Thin cd-and-run shim (publisher-prototype/PLAN.md §0.1): all CI logic —
# boundary check, lint, typecheck, unit tests, build — lives in the
# directory's own package.json (`npm run ci`). The future repo gets working
# CI by copying this one small file to its root and dropping the cd.

name: publisher-prototype CI

on:
  push:
    paths:
      - "publisher-prototype/**"
      - ".github/workflows/publisher-prototype-ci.yml"
  workflow_dispatch:

concurrency:
  group: publisher-prototype-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: publisher-prototype

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: publisher-prototype/.nvmrc
          cache: npm
          cache-dependency-path: publisher-prototype/package-lock.json
      - run: npm ci
      - run: npm run ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prototype-playwright-artifacts
          path: |
            publisher-prototype/playwright-report/
            publisher-prototype/test-results/
          if-no-files-found: ignore

  # Deploy-image smoke, the counterpart to the POC's `docker` lane
  # (docs/DEPLOY_CLOUD_RUN_PLAN.md): nothing else proves that the static host
  # serves the built app and falls back for client-side routes.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t publisher-prototype .

      - name: Boot — serves the app, with SPA fallback and cache policy
        run: |
          set -euo pipefail
          docker run -d --name proto -p 8080:8080 publisher-prototype
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then
              echo "::error::Static host never became ready on :8080"; docker logs proto; exit 1
            fi
            sleep 2
          done
          # The built shell, not a directory listing.
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root"'
          # Unknown paths fall back to index.html rather than 404.
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/some/deep/link)" = 200
          curl -sSI http://localhost:8080/ | grep -qi 'cache-control: no-cache'
          asset="$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)"
          test -n "$asset"
          curl -sSI "http://localhost:8080$asset" | grep -qi 'cache-control: .*immutable'

      - name: Container logs on failure
        if: failure()
        run: docker logs proto || true
      - name: Stop the container
        if: always()
        run: docker rm -f proto || true
