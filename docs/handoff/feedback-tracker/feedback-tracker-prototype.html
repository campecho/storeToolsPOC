document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"422ee47f-cab3-432c-a3e6-d7ad0b9a55d1\"><\u002Fscript>\n<script src=\"eb2af5bd-b783-482d-ba90-d304c893dee8\"><\u002Fscript>\n<script src=\"69d8c0b4-289d-4a3f-a3fb-38ef566a77ab\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<meta name=\"design_doc_mode\" content=\"canvas\">\n<style>/* ------------------------------------------------------------------\n   Staples Print Design System — colors & type\n   Reverse-engineered from the live Staples Print site, Figma source,\n   and the official Staples color library.\n   Load this once at the top of any artifact.\n   ------------------------------------------------------------------ */\n\n/* ───────────────────────── FONTS ───────────────────────── */\n@font-face {\n  font-family: \"Motiva Sans\";\n  src: url(\"de520467-bcb2-4d57-aa97-e0db3765f302\") format(\"woff2\");\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Motiva Sans\";\n  src: url(\"defafd8c-41f0-4ccc-8b5c-9a5759ddce28\") format(\"woff2\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Motiva Sans\";\n  src: url(\"2b6bccab-4c14-4e03-9d74-ec5257391eae\") format(\"woff2\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Motiva Sans\";\n  src: url(\"60e60f2a-3bcf-44d6-af8b-e546594de3ce\") format(\"woff2\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  /* ─────────────────────── CORE BRAND ─────────────────────── */\n  --brand:              #CC0000;   /* alias: --staples-red — primary brand / CTAs / promo bar */\n  --staples-red:        #CC0000;\n  --brand-text:         #FFFFFF;\n\n  /* ─────────────────────── BLACK / WHITE ─────────────────────── */\n  --white:              #FFFFFF;\n  --black:              #000000;\n  --secondary-black:    #00000C;\n  --light-black:        #363534;\n  --ink:                #1A1A1A;   /* Body & headings — effectively black */\n\n  /* ─────────────────────── GRAYS (official ramp) ─────────────────────── */\n  --dark-gray-1:        #4D4D4F;\n  --dark-gray-2:        #757575;\n  --medium-gray-1:      #969696;\n  --medium-gray-2:      #BCBCBC;\n  --neutral-gray:       #9B9B9B;\n  --light-gray-1:       #DDDDDD;   /* pill / card border */\n  --light-gray-2:       #F3F3F3;\n  --light-gray-3:       #ECECEC;\n  --gray-placeholder:   #D9D9D9;   /* Figma image placeholder fill */\n\n  /* ─────────────────────── REDS (full ramp) ─────────────────────── */\n  --red:                #CC0000;   /* alias of brand */\n  --dark-red:           #A30000;   /* hover/pressed */\n  --color-red-800:      #6B1707;\n  --staples-magenta:    #823267;\n  --medium-red-1:       #E35555;\n  --medium-red-2:       #F59191;\n  --light-red-1:        #F7BABA;\n  --light-red-2:        #FBEBEB;\n\n  /* ─────────────────────── BLUES ─────────────────────── */\n  --link-blue:          #086DD2;   /* official link colour */\n  --staples-blue:       #10A0D1;\n  --alice-blue:         #F5FAFE;\n  --light-blue:         #ECF4FD;\n  --premium:            #2A78C6;   /* Staples Premium sub-brand */\n  --premium-1:          #0056AC;\n  --ars-blue:           #005C8A;\n  --select:             #0E7477;   /* Staples Select sub-brand */\n\n  /* ─────────────────────── SEMANTIC (official) ─────────────────────── */\n  --negative:           #DD1700;   /* error */\n  --medium-negative:    #F5BAB3;\n  --light-negative:     #FFEFED;\n  --warning:            #F47F20;\n  --medium-warning:     #FED471;\n  --light-warning:      #FFF6DF;\n  --info:               #529EEB;\n  --medium-info:        #A9CFF5;\n  --light-info:         #EDF6FF;\n  --positive:           #4CBF2F;\n  --medium-positive:    #A6DF97;\n  --light-positive:     #EFFBEC;\n\n  /* ─────────────────────── SUB-BRANDS ─────────────────────── */\n  --easy-rewards:           #5B0069;\n  --easy-rewards-tint:      #7C008F;\n  --easy-rewards-primary-blue: #0058D8;\n  --rewards:                #E0B769;\n  --light-rewards:          #FFD173;\n  --dark-rewards:           #C08B28;\n  --contract:               #751C59;\n  --hitouch-orange:         #FF6600;\n  --activate:               #5B0069;\n\n  /* ─────────────────────── PRINT INKS (CMYK + RGB) ─────────────────────── */\n  --ink-cyan:           #00AFF3;\n  --ink-light-cyan:     #7CD8FC;\n  --ink-magenta:        #ED3596;\n  --ink-light-magenta:  #FF9DD0;\n  --ink-yellow:         #FFBE43;\n  --ink-light-yellow:   #FFDF86;\n  --ink-black:          #000000;\n  --ink-red:            #F60015;\n  --ink-blue:           #086DD2;\n  --ink-green:          #4CBF2F;\n  --ink-orange:         #F47F20;\n  --ink-violet:         #AC7AD8;\n  --ink-gray:           #969697;\n  --ink-light-black:    #686666;\n  --ink-light-gray:     #DDDDDD;\n\n  /* ─────────────────────── EXTENDED ACCENTS ─────────────────────── */\n  --navy:               #486190;\n  --medium-navy-1:      #6F8DC8;\n  --medium-navy-2:      #9AB2E1;\n  --light-navy-1:       #C1D3F4;\n  --light-navy-2:       #E9F0FD;\n\n  --teal:               #378274;\n  --medium-teal-1:      #6FB8AB;\n  --medium-teal-2:      #9ED6CC;\n  --light-teal-1:       #C0EBE3;\n  --light-teal-2:       #E4FAF6;\n\n  --forest:             #048103;\n  --medium-forest-1:    #65A75C;\n  --medium-forest-2:    #80C687;\n  --light-forest-1:     #A9DEAF;\n  --light-forest-2:     #E0F7E2;\n\n  --green:              #5A970D;\n  --medium-green-1:     #8CBF3C;\n  --medium-green-2:     #AED76F;\n  --light-green-1:      #CDE9A1;\n  --light-green-2:      #EEF8E0;\n\n  --earth:              #784E4E;\n  --medium-earth-1:     #A58080;\n  --medium-earth-2:     #BDA1A1;\n  --light-earth-1:      #DFCACA;\n  --light-earth-2:      #FFF2F2;\n\n  --orange:             #C74D00;\n  --medium-orange-1:    #F07120;\n  --medium-orange-2:    #FF9450;\n  --light-orange-1:     #FFB78A;\n  --light-orange-2:     #FFECE0;\n\n  --purple:             #4B5197;\n  --medium-purple-1:    #757CD2;\n  --medium-purple-2:    #A3A9EC;\n  --light-purple-1:     #D0D3FA;\n  --light-purple-2:     #F1F2FF;\n\n  --pink:               #BB3394;\n  --medium-pink-1:      #DE7BC2;\n  --medium-pink-2:      #F9A6E1;\n  --light-pink-1:       #FFC6EF;\n  --light-pink-2:       #FFECFA;\n\n  --magenta:            #832F68;\n  --medium-magenta-1:   #B17097;\n  --medium-magenta-2:   #D19DBB;\n  --light-magenta-1:    #E8C9DD;\n  --light-magenta-2:    #FBF2F9;\n\n  --yellow:             #F09E00;\n  --medium-yellow-1:    #F5BE2F;\n  --medium-yellow-2:    #F9D26F;\n  --light-yellow-1:     #F7E2AC;\n  --light-yellow-2:     #FBF4DA;\n  --dark-yellow:        #D48103;\n\n  /* ─────────────────────── TRANSPARENCY ─────────────────────── */\n  --transparent:           transparent;\n  --gray-transparent:      rgba(0, 0, 0, 0.20);\n  --light-gray-transparent: rgba(0, 0, 0, 0.10);\n\n  /* ─────────────────────── SEMANTIC ROLES (use these in components) ─────────────────────── */\n  --fg-1:           var(--ink);\n  --fg-2:           var(--dark-gray-1);\n  --fg-3:           var(--medium-gray-1);\n  --fg-on-red:      var(--white);\n  --fg-link:        var(--link-blue);\n\n  --bg-1:           var(--white);\n  --bg-2:           var(--light-gray-2);\n  --bg-3:           var(--light-gray-3);\n\n  --border-1:       var(--light-gray-1);\n  --border-2:       var(--light-gray-3);\n\n  --focus-ring:     var(--brand);\n\n  --error:          var(--negative);\n  --error-bg:       var(--light-negative);\n  --success:        var(--positive);\n  --success-bg:     var(--light-positive);\n\n  /* ─────────────────────── BACKWARDS-COMPAT (older preview cards) ─────────────────────── */\n  --staples-red-dark:   var(--dark-red);\n  --staples-red-light:  #FF0000;\n  --staples-red-tint:   var(--light-red-2);\n  --gray-900:           var(--dark-gray-1);\n  --gray-700:           var(--dark-gray-2);\n  --gray-600:           #666666;\n  --gray-500:           var(--medium-gray-1);\n  --gray-400:           var(--medium-gray-2);\n  --gray-300:           var(--light-gray-1);\n  --gray-200:           var(--light-gray-3);\n  --gray-150:           var(--gray-placeholder);\n  --gray-100:           var(--light-gray-2);\n  --gray-50:            #F8F8F8;\n  --gray-bg:            #F7F7F7;\n  --link:               var(--link-blue);\n  --promo-yellow:       #FFED67;\n  --promo-text:         var(--ink);\n  --same-day-blue:      #0D47A1;\n  --same-day-bg:        #E3F2FD;\n  --new-badge:          #1B5E20;\n  --warning-bg:         var(--light-warning);\n  --info-bg:            var(--light-info);\n  --success-light:      var(--light-positive);\n\n  /* ─────────────────────── TYPE — FAMILIES ─────────────────────── */\n  --font-sans: \"Motiva Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --font-fallback: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --font-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* ─────────────────────── TYPE — OFFICIAL WEB SCALE ───────────────────────\n     Source: official Staples typography spec. Body is Light (300), Body Emphasis is Medium (500).\n     ─────────────────────────────────────────────────────────────────────── */\n  --fs-h1:        32px;   --lh-h1: 40px;\n  --fs-h2:        26px;   --lh-h2: 32px;\n  --fs-h3:        20px;   --lh-h3: 26px;\n  --fs-h4:        18px;   --lh-h4: 24px;\n  --fs-body:      16px;   --lh-body: 24px;       /* Light 300 */\n  --fs-body-emp:  16px;   --lh-body-emp: 24px;   /* Medium 500 */\n  --fs-mini:      14px;   --lh-mini: 20px;       /* Light 300 */\n  --fs-legal:     12px;   --lh-legal: 16px;      /* Light 300 */\n\n  /* ─────────────────────── TYPE — OFFICIAL MOBILE SCALE ─────────────────── */\n  --fs-h1-m:        24px;   --lh-h1-m: 30px;\n  --fs-h2-m:        20px;   --lh-h2-m: 26px;\n  --fs-h3-m:        18px;   --lh-h3-m: 24px;\n  --fs-h4-m:        16px;   --lh-h4-m: 22px;\n  --fs-body-m:      14px;   --lh-body-m: 18px;   /* Regular 400 on mobile */\n  --fs-body2-m:     13px;   --lh-body2-m: 18px;\n  --fs-mini-m:      12px;   --lh-mini-m: 16px;\n\n  /* ─────────────────────── TYPE — RAW SIZE ALIASES (backwards-compat) ─────────────────────── */\n  --fs-2xs:  12px;   /* legal */\n  --fs-xs:   13px;   /* mobile body 2 */\n  --fs-sm:   14px;   /* mini */\n  --fs-base: 16px;   /* body */\n  --fs-md:   18px;   /* h4 */\n  --fs-lg:   20px;   /* h3 */\n  --fs-xl:   24px;   /* mobile h1 */\n  --fs-2xl:  26px;   /* h2 */\n  --fs-3xl:  32px;   /* h1 */\n  --fs-4xl:  48px;   /* poster only */\n  --fs-5xl:  80px;   /* hero only — avoid */\n\n  --fw-light:    300;   /* @kind font */ /* default for body */\n  --fw-regular:  400;   /* @kind font */\n  --fw-medium:   500;   /* @kind font */ /* body emphasis */\n  --fw-demi:     500;   /* @kind font */ /* alias */\n  --fw-bold:     700;   /* @kind font */ /* all headings */\n  --fw-black:    700;   /* @kind font */ /* alias — there is no 900 cut */\n\n  --lh-tight: 1.0;   /* @kind font */\n  --lh-snug:  1.25;  /* @kind font */\n  --lh-base:  1.5;   /* @kind font */\n  --lh-loose: 1.7;   /* @kind font */\n\n  --tracking-tight:   -0.01em;  /* @kind font */\n  --tracking-normal:  0;        /* @kind font */\n  --tracking-wide:    0.04em;   /* @kind font */\n  --tracking-caps:    0.08em;   /* @kind font */\n\n  /* ─────────────────────── SPACING (4px base) ─────────────────────── */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* ─────────────────────── RADII ─────────────────────── */\n  --r-xs:   4px;\n  --r-sm:   6px;\n  --r-md:   8px;\n  --r-lg:   12px;\n  --r-xl:   16px;\n  --r-tile: 10px;\n  --r-pill: 75px;\n  --r-full: 9999px;\n\n  /* ─────────────────────── SHADOWS ─────────────────────── */\n  --shadow-card:  0 1px 4px rgba(0,0,0,0.10);\n  --shadow-hover: 0 4px 12px rgba(0,0,0,0.14);\n  --shadow-modal: 0 8px 32px rgba(0,0,0,0.20);\n  --shadow-pop:   0 2px 8px rgba(0,0,0,0.09);\n  --shadow-nav:   0 2px 4px rgba(0,0,0,0.08);\n\n  /* ─────────────────────── MOTION ─────────────────────── */\n  --dur-fast:  150ms;   /* @kind other */\n  --dur-base:  200ms;   /* @kind other */\n  --dur-slow:  300ms;   /* @kind other */\n  --ease:      ease;                              /* @kind other */\n  --ease-out:  cubic-bezier(0.0, 0.0, 0.2, 1);    /* @kind other */\n  --ease-in:   cubic-bezier(0.4, 0.0, 1, 1);      /* @kind other */\n\n  /* ─────────────────────── LAYOUT ─────────────────────── */\n  --content-max: 1280px;\n  --page-pad:    24px;\n  --section-py:  64px;\n}\n\n/* ───────────────────────── BASE ELEMENT STYLES ───────────────────────── */\nhtml { color-scheme: light; }\nbody {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  font-weight: var(--fw-light);          /* official: body is Light 300 */\n  line-height: calc(var(--lh-body) / var(--fs-body));\n  color: var(--fg-1);\n  background: var(--bg-1);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Semantic shortcuts — match the official Web scale */\nh1, .h1 { font-size: var(--fs-h1); line-height: calc(var(--lh-h1)/var(--fs-h1)); font-weight: var(--fw-bold); color: var(--fg-1); margin: 0; }\nh2, .h2 { font-size: var(--fs-h2); line-height: calc(var(--lh-h2)/var(--fs-h2)); font-weight: var(--fw-bold); color: var(--fg-1); margin: 0; }\nh3, .h3 { font-size: var(--fs-h3); line-height: calc(var(--lh-h3)/var(--fs-h3)); font-weight: var(--fw-bold); color: var(--fg-1); margin: 0; }\nh4, .h4 { font-size: var(--fs-h4); line-height: calc(var(--lh-h4)/var(--fs-h4)); font-weight: var(--fw-bold); color: var(--fg-1); margin: 0; }\n\n.body          { font-size: var(--fs-body); font-weight: var(--fw-light);  line-height: calc(var(--lh-body)/var(--fs-body)); color: var(--fg-1); }\n.body-emphasis { font-size: var(--fs-body); font-weight: var(--fw-medium); line-height: calc(var(--lh-body)/var(--fs-body)); color: var(--fg-1); }\n.mini          { font-size: var(--fs-mini); font-weight: var(--fw-light);  line-height: calc(var(--lh-mini)/var(--fs-mini)); color: var(--fg-2); }\n.legal         { font-size: var(--fs-legal); font-weight: var(--fw-light); line-height: calc(var(--lh-legal)/var(--fs-legal)); color: var(--fg-3); }\n\n/* Legacy aliases (some preview cards & the UI kit still reference these) */\n.eyebrow  { font-size: var(--fs-h3); font-weight: var(--fw-bold); line-height: var(--lh-tight); color: var(--fg-1); }\n.body-sm  { font-size: var(--fs-mini); color: var(--fg-2); line-height: var(--lh-base); }\n.meta     { font-size: var(--fs-xs); color: var(--fg-2); }\n.fine     { font-size: var(--fs-legal); color: var(--fg-3); line-height: var(--lh-base); }\n.price    { font-size: var(--fs-h4); font-weight: var(--fw-bold); color: var(--brand); }\n.price-reg { font-size: var(--fs-mini); color: var(--fg-2); text-decoration: line-through; }\n.section-sub { font-size: var(--fs-body); color: var(--dark-gray-1); max-width: 60ch; }\n\na.link { color: var(--link-blue); text-decoration: underline; text-underline-offset: 2px; }\na.link:hover { color: var(--brand); }\n\n:focus-visible {\n  outline: 2px solid var(--focus-ring);\n  outline-offset: 2px;\n  border-radius: 2px;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing:border-box; }\n  body { margin:0; background:#cfcfcf; font-family:\"Motiva Sans\", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }\n  ::-webkit-scrollbar{ width:9px; height:9px; }\n  ::-webkit-scrollbar-thumb{ background:#c6c6c6; border-radius:5px; }\n  ::-webkit-scrollbar-track{ background:transparent; }\n  input, textarea { font-family:inherit; }\n  @keyframes pulseCount { 0%{transform:scale(1);} 32%{transform:scale(1.45);} 100%{transform:scale(1);} }\n  @keyframes popIn { from{transform:scale(.96);opacity:0;} to{transform:scale(1);opacity:1;} }\n  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }\n  @keyframes slideIn { from{transform:translateX(30px);opacity:0;} to{transform:translateX(0);opacity:1;} }\n  @keyframes ringExpand { from{transform:scale(.35);opacity:.5;} to{transform:scale(1.75);opacity:0;} }\n  @keyframes starPop { 0%{transform:scale(0) rotate(-25deg);opacity:0;} 55%{transform:scale(1.15) rotate(4deg);opacity:1;} 100%{transform:scale(1) rotate(0);opacity:1;} }\n  @keyframes riseGlow { 0%{background:#FBEBEB;} 100%{background:#fff;} }\n  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-3px);} 75%{transform:translateX(3px);} }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; padding:26px 22px 40px; display:flex; flex-direction:column; align-items:center;\">\n\n  <!-- caption + legend -->\n  <div style=\"width:1440px; max-width:100%; margin-bottom:12px; display:flex; justify-content:space-between; align-items:flex-end; gap:20px;\">\n    <div>\n      <div style=\"font-weight:700; font-size:22px; color:#1a1a1a; letter-spacing:-.01em;\">In-Store Suite — Feedback &amp; Request Tracker<\u002Fdiv>\n      <div style=\"font-weight:300; font-size:13px; color:#5a5a5a; margin-top:4px;\">Functional wireframe · counter-associate side · desktop in-store station. One tap to report, one tap to back what others raised, and see it ship.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:16px; align-items:center; flex-shrink:0;\">\n      <div style=\"display:flex; align-items:center; gap:6px;\"><div style=\"width:12px; height:12px; border-radius:3px; background:#CC0000;\"><\u002Fdiv><span style=\"font-size:11px; color:#555;\">Action / active<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:6px;\"><div style=\"width:12px; height:12px; border-radius:50%; background:#2e8b3d;\"><\u002Fdiv><span style=\"font-size:11px; color:#555;\">Shipped / fixed<\u002Fspan><\u002Fdiv>\n      <div style=    hasUnread: unread > 0, unreadCount: unread,\n      notifOpen: s.notifOpen, closeNotif: () => this.closeNotif(), notifsD: this.buildNotifs(),\n\n      filteredItems: this.filtered(), resultCount: this.filtered().length, scopeLabel: scopeLabels[s.fScope],\n      typeOpts: typeOpts, statusOpts: statusOpts, scopeOpts: scopeOpts, topStores: topStores,\n      query: s.query, onQuery: (e) => this.setState({ query: e.target.value }),\n\n      detailOpen: detail != null, detail: detail || {}, closeDetail: () => this.closeDetail(),\n\n      releasesD: this.buildReleases(),\n\n      reportOpen: s.reportOpen, reportStep: s.reportStep,\n      rChoose: s.reportStep === 'choose', rForm: s.reportStep === 'bug' || s.reportStep === 'feature',\n      rUpvoted: s.reportStep === 'upvoted', rConfirm: s.reportStep === 'confirm',\n      isBugForm: isBug, isFeatureForm: s.reportStep === 'feature',\n      formTitle: isBug ? 'Report a problem' : 'Request a feature',\n      titleLabel: isBug ? 'What went wrong?' : 'What do you want?',\n      titlePlaceholder: isBug ? 'e.g. Large-format resize freezes the app' : 'e.g. Save a customer\\u2019s brand colors to reuse',\n      descLabel: isBug ? 'Anything to add? (optional)' : 'Why it would help (optional)',\n      descPlaceholder: isBug ? 'One line on what you were doing when it broke.' : 'One line on the problem it solves for you.',\n      submitLabel: isBug ? 'File the problem' : 'File the request',\n      reportTitle: s.reportTitle, onReportTitle: (e) => this.onReportTitle(e),\n      reportDesc: s.reportDesc, onReportDesc: (e) => this.onReportDesc(e),\n      reportName: s.reportName, onReportName: (e) => this.onReportName(e),\n      closeReport: () => this.closeReport(), chooseBug: () => this.chooseBug(), chooseFeature: () => this.chooseFeature(),\n      backToChoose: () => this.backToChoose(), submitReport: () => this.submitReport(), confirmDone: () => this.confirmDone(),\n      goBoardFromReport: () => this.goBoardFromReport(), viewUpvoted:
