  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"9a643e26-fe2b-442d-8afe-a4ed869fccd0\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n\n<style>/* ------------------------------------------------------------------\n   Staples Print Design System — colors & type\n   Reverse-engineered from the live Staples Print site, Figma source,\n   and the official Staples color library.\n   Load this once at the top of any artifact.\n   ------------------------------------------------------------------ */\n\n/* ───────────────────────── FONTS ───────────────────────── */\n@font-face {\n  font-family: \"Motiva Sans\";\n  src: url(\"8b041414-abff-455a-be92-93450ff4005e\") format(\"woff2\");\n  font-weight: 300;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Motiva Sans\";\n  src: url(\"c56a1bbd-220c-4fa5-a460-9154ff2c6a27\") format(\"woff2\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Motiva Sans\";\n  src: url(\"be383a4b-4216-4780-9cda-9901b5464094\") format(\"woff2\");\n  font-weight: 500;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Motiva Sans\";\n  src: url(\"8db3f03e-807e-45e3-8a6b-dbfe7ede8c3e\") format(\"woff2\");\n  font-weight: 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  /* ─────────────────────── CORE BRAND ─────────────────────── */\n  --brand:              #CC0000;   /* alias: --staples-red — primary brand / CTAs / promo bar */\n  --staples-red:        #CC0000;\n  --brand-text:         #FFFFFF;\n\n  /* ─────────────────────── BLACK / WHITE ─────────────────────── */\n  --white:              #FFFFFF;\n  --black:              #000000;\n  --secondary-black:    #00000C;\n  --light-black:        #363534;\n  --ink:                #1A1A1A;   /* Body & headings — effectively black */\n\n  /* ─────────────────────── GRAYS (official ramp) ─────────────────────── */\n  --dark-gray-1:        #4D4D4F;\n  --dark-gray-2:        #757575;\n  --medium-gray-1:      #969696;\n  --medium-gray-2:      #BCBCBC;\n  --neutral-gray:       #9B9B9B;\n  --light-gray-1:       #DDDDDD;   /* pill / card border */\n  --light-gray-2:       #F3F3F3;\n  --light-gray-3:       #ECECEC;\n  --gray-placeholder:   #D9D9D9;   /* Figma image placeholder fill */\n\n  /* ─────────────────────── REDS (full ramp) ─────────────────────── */\n  --red:                #CC0000;   /* alias of brand */\n  --dark-red:           #A30000;   /* hover/pressed */\n  --color-red-800:      #6B1707;\n  --staples-magenta:    #823267;\n  --medium-red-1:       #E35555;\n  --medium-red-2:       #F59191;\n  --light-red-1:        #F7BABA;\n  --light-red-2:        #FBEBEB;\n\n  /* ─────────────────────── BLUES ─────────────────────── */\n  --link-blue:          #086DD2;   /* official link colour */\n  --staples-blue:       #10A0D1;\n  --alice-blue:         #F5FAFE;\n  --light-blue:         #ECF4FD;\n  --premium:            #2A78C6;   /* Staples Premium sub-brand */\n  --premium-1:          #0056AC;\n  --ars-blue:           #005C8A;\n  --select:             #0E7477;   /* Staples Select sub-brand */\n\n  /* ─────────────────────── SEMANTIC (official) ─────────────────────── */\n  --negative:           #DD1700;   /* error */\n  --medium-negative:    #F5BAB3;\n  --light-negative:     #FFEFED;\n  --warning:            #F47F20;\n  --medium-warning:     #FED471;\n  --light-warning:      #FFF6DF;\n  --info:               #529EEB;\n  --medium-info:        #A9CFF5;\n  --light-info:         #EDF6FF;\n  --positive:           #4CBF2F;\n  --medium-positive:    #A6DF97;\n  --light-positive:     #EFFBEC;\n\n  /* ─────────────────────── SUB-BRANDS ─────────────────────── */\n  --easy-rewards:           #5B0069;\n  --easy-rewards-tint:      #7C008F;\n  --easy-rewards-primary-blue: #0058D8;\n  --rewards:                #E0B769;\n  --light-rewards:          #FFD173;\n  --dark-rewards:           #C08B28;\n  --contract:               #751C59;\n  --hitouch-orange:         #FF6600;\n  --activate:               #5B0069;\n\n  /* ─────────────────────── PRINT INKS (CMYK + RGB) ─────────────────────── */\n  --ink-cyan:           #00AFF3;\n  --ink-light-cyan:     #7CD8FC;\n  --ink-magenta:        #ED3596;\n  --ink-light-magenta:  #FF9DD0;\n  --ink-yellow:         #FFBE43;\n  --ink-light-yellow:   #FFDF86;\n  --ink-black:          #000000;\n  --ink-red:            #F60015;\n  --ink-blue:           #086DD2;\n  --ink-green:          #4CBF2F;\n  --ink-orange:         #F47F20;\n  --ink-violet:         #AC7AD8;\n  --ink-gray:           #969697;\n  --ink-light-black:    #686666;\n  --ink-light-gray:     #DDDDDD;\n\n  /* ─────────────────────── EXTENDED ACCENTS ─────────────────────── */\n  --navy:               #486190;\n  --medium-navy-1:      #6F8DC8;\n  --medium-navy-2:      #9AB2E1;\n  --light-navy-1:       #C1D3F4;\n  --light-navy-2:       #E9F0FD;\n\n  --teal:               #378274;\n  --medium-teal-1:      #6FB8AB;\n  --medium-teal-2:      #9ED6CC;\n  --light-teal-1:       #C0EBE3;\n  --light-teal-2:       #E4FAF6;\n\n  --forest:             #048103;\n  --medium-forest-1:    #65A75C;\n  --medium-forest-2:    #80C687;\n  --light-forest-1:     #A9DEAF;\n  --light-forest-2:     #E0F7E2;\n\n  --green:              #5A970D;\n  --medium-green-1:     #8CBF3C;\n  --medium-green-2:     #AED76F;\n  --light-green-1:      #CDE9A1;\n  --light-green-2:      #EEF8E0;\n\n  --earth:              #784E4E;\n  --medium-earth-1:     #A58080;\n  --medium-earth-2:     #BDA1A1;\n  --light-earth-1:      #DFCACA;\n  --light-earth-2:      #FFF2F2;\n\n  --orange:             #C74D00;\n  --medium-orange-1:    #F07120;\n  --medium-orange-2:    #FF9450;\n  --light-orange-1:     #FFB78A;\n  --light-orange-2:     #FFECE0;\n\n  --purple:             #4B5197;\n  --medium-purple-1:    #757CD2;\n  --medium-purple-2:    #A3A9EC;\n  --light-purple-1:     #D0D3FA;\n  --light-purple-2:     #F1F2FF;\n\n  --pink:               #BB3394;\n  --medium-pink-1:      #DE7BC2;\n  --medium-pink-2:      #F9A6E1;\n  --light-pink-1:       #FFC6EF;\n  --light-pink-2:       #FFECFA;\n\n  --magenta:            #832F68;\n  --medium-magenta-1:   #B17097;\n  --medium-magenta-2:   #D19DBB;\n  --light-magenta-1:    #E8C9DD;\n  --light-magenta-2:    #FBF2F9;\n\n  --yellow:             #F09E00;\n  --medium-yellow-1:    #F5BE2F;\n  --medium-yellow-2:    #F9D26F;\n  --light-yellow-1:     #F7E2AC;\n  --light-yellow-2:     #FBF4DA;\n  --dark-yellow:        #D48103;\n\n  /* ─────────────────────── TRANSPARENCY ─────────────────────── */\n  --transparent:           transparent;\n  --gray-transparent:      rgba(0, 0, 0, 0.20);\n  --light-gray-transparent: rgba(0, 0, 0, 0.10);\n\n  /* ─────────────────────── SEMANTIC ROLES (use these in components) ─────────────────────── */\n  --fg-1:           var(--ink);\n  --fg-2:           var(--dark-gray-1);\n  --fg-3:           var(--medium-gray-1);\n  --fg-on-red:      var(--white);\n  --fg-link:        var(--link-blue);\n\n  --bg-1:           var(--white);\n  --bg-2:           var(--light-gray-2);\n  --bg-3:           var(--light-gray-3);\n\n  --border-1:       var(--light-gray-1);\n  --border-2:       var(--light-gray-3);\n\n  --focus-ring:     var(--brand);\n\n  --error:          var(--negative);\n  --error-bg:       var(--light-negative);\n  --success:        var(--positive);\n  --success-bg:     var(--light-positive);\n\n  /* ─────────────────────── BACKWARDS-COMPAT (older preview cards) ─────────────────────── */\n  --staples-red-dark:   var(--dark-red);\n  --staples-red-light:  #FF0000;\n  --staples-red-tint:   var(--light-red-2);\n  --gray-900:           var(--dark-gray-1);\n  --gray-700:           var(--dark-gray-2);\n  --gray-600:           #666666;\n  --gray-500:           var(--medium-gray-1);\n  --gray-400:           var(--medium-gray-2);\n  --gray-300:           var(--light-gray-1);\n  --gray-200:           var(--light-gray-3);\n  --gray-150:           var(--gray-placeholder);\n  --gray-100:           var(--light-gray-2);\n  --gray-50:            #F8F8F8;\n  --gray-bg:            #F7F7F7;\n  --link:               var(--link-blue);\n  --promo-yellow:       #FFED67;\n  --promo-text:         var(--ink);\n  --same-day-blue:      #0D47A1;\n  --same-day-bg:        #E3F2FD;\n  --new-badge:          #1B5E20;\n  --warning-bg:         var(--light-warning);\n  --info-bg:            var(--light-info);\n  --success-light:      var(--light-positive);\n\n  /* ─────────────────────── TYPE — FAMILIES ─────────────────────── */\n  --font-sans: \"Motiva Sans\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --font-fallback: \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  --font-mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* ─────────────────────── TYPE — OFFICIAL WEB SCALE ───────────────────────\n     Source: official Staples typography spec. Body is Light (300), Body Emphasis is Medium (500).\n     ─────────────────────────────────────────────────────────────────────── */\n  --fs-h1:        32px;   --lh-h1: 40px;\n  --fs-h2:        26px;   --lh-h2: 32px;\n  --fs-h3:        20px;   --lh-h3: 26px;\n  --fs-h4:        18px;   --lh-h4: 24px;\n  --fs-body:      16px;   --lh-body: 24px;       /* Light 300 */\n  --fs-body-emp:  16px;   --lh-body-emp: 24px;   /* Medium 500 */\n  --fs-mini:      14px;   --lh-mini: 20px;       /* Light 300 */\n  --fs-legal:     12px;   --lh-legal: 16px;      /* Light 300 */\n\n  /* ─────────────────────── TYPE — OFFICIAL MOBILE SCALE ─────────────────── */\n  --fs-h1-m:        24px;   --lh-h1-m: 30px;\n  --fs-h2-m:        20px;   --lh-h2-m: 26px;\n  --fs-h3-m:        18px;   --lh-h3-m: 24px;\n  --fs-h4-m:        16px;   --lh-h4-m: 22px;\n  --fs-body-m:      14px;   --lh-body-m: 18px;   /* Regular 400 on mobile */\n  --fs-body2-m:     13px;   --lh-body2-m: 18px;\n  --fs-mini-m:      12px;   --lh-mini-m: 16px;\n\n  /*
